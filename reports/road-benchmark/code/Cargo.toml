[package]
name = "dispatch-sat"
version = "0.1.0"
edition = "2021"

[dependencies]
cadical = "0.1.16"
csv = "1.3"
calamine = "0.36"
ureq = { version = "3.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
